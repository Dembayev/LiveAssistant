# /etc/nginx/sites-available/podskazchik
server {
    listen 80;
    listen [::]:80;
    server_name 62-217-178-121.sslip.io;

    root /var/www/podskazchik;          # сайт и файлы для скачивания
    index index.html;
    client_max_body_size 8m;            # скриншоты и аудио

    location /v1/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;            # ответ ИИ идёт потоком
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8765;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
